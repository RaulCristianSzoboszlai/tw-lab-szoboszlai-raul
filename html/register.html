<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/register_style.css">
    <title>Register Page</title>
</head>
<body>
    <main class="page">
        <section class="card">
            <h1>Înregistrează-te</h1>
            <form class="register-form" action="#" method="post" enctype="multipart/form-data">
                <div class="row">
                    <label for="username">Nume utilizator</label>
                    <input type="text" id="username" name="username" placeholder="ex: raulTW" required>
                </div>
                <div class="row">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="ex: raul.szoboszlai05@e-uvt.ro" required>
                </div>
                <div class="row two-col">
                    <div>
                        <label for="password">Parolă</label>
                        <input type="password" id="password" name="password" required>
                    </div>
                    <div>
                        <label for="confirm_password">Confirmă parola</label>
                        <input type="password" id="confirm_password" name="confirm_password" required>
                    </div>
                </div>

                <div class="row">
                    <label for="dob">Data nașterii</label>
                    <input type="date" id="dob" name="dob">
                </div>

                <div class="row">
                    <label>Gen</label>
                    <div style="display: flex; gap: 15px;">
                        <label><input type="radio" name="gender" value="femeie"> Femeie</label>
                        <label><input type="radio" name="gender" value="barbat"> Bărbat</label>
                        <label><input type="radio" name="gender" value="altul"> Altul</label>
                    </div>
                </div>

                <div class="row">
                    <label for="country">Țară</label>
                    <select id="country" name="country">
                        <option value="ro">România</option>
                        <option value="uk">Regatul Unit</option>
                        <option value="us">Statele Unite</option>
                        <option value="other">Altă țară</option>
                    </select>
                </div>

                <div class="row">
                    <label>Interese / Hobbies</label>
                    <div class="checkbox-grid">
                        <label><input type="checkbox" name="interests" value="frontend"> Frontend</label>
                        <label><input type="checkbox" name="interests" value="backend"> Backend</label>
                        <label><input type="checkbox" name="interests" value="uiux"> UI/UX</label>
                        <label><input type="checkbox" name="interests" value="javascript"> JavaScript</label>
                    </div>
                </div>

                <div class="row">
                    <label for="profile_pic">Poză de profil</label>
                    <input type="file" id="profile_pic" name="profile_pic">
                </div>

                <div class="actions">
                    <button type="submit" class="btn primary">Creează cont</button>
                    <button type="reset" class="btn ghost">Resetează</button>
                </div>
                <p class="login-link">
                    Ai deja cont?
                    <a href="login.html">Mergi la login</a>
                </p>
            </form>
        </section>
    </main>
</body>
</html>
