<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Page</title>
    {% load static %}
    <link rel="stylesheet" type="text/css" href="{% static 'css/style.css' %}" />
    <link rel="stylesheet" type="text/css" href="{% static 'css/login_style.css' %}" />
    <script src="{% static 'js/login_js.js' %}" defer></script>
  </head>
  <body>
    {% block content %}
    <div class="login-container">
      <div class="login-image">
        <img src="{% static 'media/login_image.png' %}" alt="Imagine login" />
      </div>
      <div class="separator"></div>
      <div class="login-form">
        <h2>Login</h2>
        <form id="loginForm">
          <input type="email" id="email" placeholder="Email" required />
          <input type="password" id="password" placeholder="Parola" required />
          <button type="submit">Autentificare</button>
        </form>
        <p class="register-text">
          Nu ai cont? <a href="{% url 'register' %}">Înregistrează-te</a>
        </p>
      </div>
    </div>
    {% endblock %}
  </body>
</html>
