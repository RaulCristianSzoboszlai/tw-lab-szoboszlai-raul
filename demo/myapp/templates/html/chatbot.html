<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chatbot</title>
    {% load static %}
    <link rel="stylesheet" type="text/css" href="{% static 'css/chatbot_style.css' %}" />
  </head>
  <body>
    <div class="header-actions">
      <a href="{% url 'home' %}" class="back-link">&larr; Înapoi la Acasă</a>
    </div>

    {% block content %}
    <div class="chat-container" id="chat-container"></div>

    <form id="chat-form">
      <input type="text" id="user-input" placeholder="Răspunde aici (a, b sau c)..." autocomplete="off" />
      <button type="submit">Trimite</button>
    </form>
    {% endblock %}

    <script src="{% static 'js/chatbot_js.js' %}"></script>
  </body>
</html>
