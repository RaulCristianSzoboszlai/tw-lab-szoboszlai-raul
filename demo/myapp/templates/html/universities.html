<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universități din România</title>
    {% load static %}
    <link rel="stylesheet" type="text/css" href="{% static 'css/universities_style.css' %}">
</head>
<body>
    <main class="page-container">
        <div class="header-actions">
            <a href="{% url 'home' %}" class="back-link">&larr; Înapoi la Acasă</a>
        </div>

        {% block content %}
        <section class="content-card">
            <h1>Universități din România</h1>

            <div class="controls">
                <div class="search-box">
                    <label for="q">Filtru (opțional):</label>
                    <input id="q" placeholder="Caută după nume..." autocomplete="off" />
                </div>
                <button id="exportBtn" class="btn primary">Export CSV</button>
            </div>

            <div id="status" class="status"></div>

            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Nume</th>
                            <th>Țara</th>
                            <th>Site</th>
                        </tr>
                    </thead>
                    <tbody id="tbody"></tbody>
                </table>
            </div>
        </section>
        {% endblock %}
    </main>

    <script src="{% static 'js/universities_js.js' %}"></script>
</body>
</html>
